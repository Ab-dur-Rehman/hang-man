<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta
      name="description"
      content="A responsive Hangman word game with hints, keyboard play, and accessible controls."
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("hangman-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./app.css" />
    <title>Hangman</title>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">H</span>
          <div>
            <p class="eyebrow">Word game</p>
            <h1 id="app-title">Hangman</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="theme-switch" aria-label="Theme preference">
            <button
              class="theme-option"
              type="button"
              data-theme-option="light"
              aria-pressed="true"
            >
              Light
            </button>
            <button
              class="theme-option"
              type="button"
              data-theme-option="dark"
              aria-pressed="false"
            >
              Dark
            </button>
          </div>
          <button class="primary-action" type="button" data-action="new-game">
            New Game
          </button>
        </div>
      </header>

      <section class="game-layout" aria-label="Hangman game">
        <aside class="side-panel">
          <div class="panel-section">
            <p class="eyebrow">Clue</p>
            <p class="hint" id="hint">Start a new game to reveal a clue.</p>
          </div>

          <div class="status-card">
            <p class="eyebrow">Round status</p>
            <p class="status" id="status" role="status" aria-live="polite">
              Ready when you are.
            </p>
          </div>

          <div class="stat-grid">
            <div class="stat">
              <span class="stat-label">Misses</span>
              <strong id="misses">0 / 7</strong>
            </div>
            <div class="stat">
              <span class="stat-label">Letters</span>
              <strong id="remaining">26 left</strong>
            </div>
          </div>
        </aside>

        <section class="stage-panel" aria-label="Word and drawing">
          <ul class="word" id="word" aria-label="Current word"></ul>

          <figure class="gallows" aria-label="Hangman drawing">
            <div class="stand-base"></div>
            <div class="stand-post"></div>
            <div class="stand-top"></div>
            <div class="rope part" data-part="0"></div>
            <div class="head part" data-part="1"></div>
            <div class="body part" data-part="2"></div>
            <div class="arm arm-left part" data-part="3"></div>
            <div class="arm arm-right part" data-part="4"></div>
            <div class="leg leg-left part" data-part="5"></div>
            <div class="leg leg-right part" data-part="6"></div>
          </figure>
        </section>

        <section class="keyboard-panel" aria-label="Letter choices">
          <div class="keyboard-header">
            <div>
              <p class="eyebrow">Keyboard</p>
              <h2>Pick a letter</h2>
            </div>
          </div>
          <div class="keyboard" id="keyboard"></div>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
