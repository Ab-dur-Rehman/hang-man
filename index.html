<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101820" />
    <meta
      name="description"
      content="A responsive Hangman word game with hints, keyboard play, and accessible controls."
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("hangman-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./app.css" />
    <title>Hangman</title>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <section class="game-console" aria-label="Hangman game">
        <header class="console-header">
          <div class="circuit-line" aria-hidden="true"></div>
          <p class="brand-mark">H</p>
          <p class="eyebrow">Word Game</p>
          <h1 id="app-title">Hangman</h1>
        </header>

        <section class="command-row" aria-label="Game controls">
          <div class="theme-module">
            <span>Light</span>
            <div class="theme-switch" aria-label="Theme preference">
              <button
                class="theme-option"
                type="button"
                data-theme-option="light"
                aria-pressed="false"
              >
                Light
              </button>
              <button
                class="theme-option"
                type="button"
                data-theme-option="dark"
                aria-pressed="true"
              >
                Dark
              </button>
            </div>
            <span>Dark</span>
          </div>

          <button class="primary-action" type="button" data-action="new-game">
            <span>New</span>
            <span>Game</span>
          </button>

          <div class="theme-module mirror">
            <span>Light</span>
            <div class="theme-switch compact" aria-hidden="true">
              <span class="toggle-track"></span>
            </div>
            <span>Dark</span>
          </div>
        </section>

        <section class="readout-panel">
          <p class="hint" id="hint">Start a new game to reveal a clue.</p>
          <div class="stat-grid">
            <div class="stat">
              <span class="stat-label">Current Misses:</span>
              <strong id="misses">0 / 7</strong>
            </div>
            <div class="stat">
              <span class="stat-label">Remaining Letters:</span>
              <strong id="remaining">26</strong>
            </div>
          </div>
        </section>

        <section class="stage-panel" aria-label="Word and drawing">
          <figure class="gallows" aria-label="Hangman drawing">
            <div class="stand-base"></div>
            <div class="stand-post"></div>
            <div class="stand-top"></div>
            <div class="rope part" data-part="0"></div>
            <div class="head part" data-part="1"></div>
            <div class="body part" data-part="2"></div>
            <div class="arm arm-left part" data-part="3"></div>
            <div class="arm arm-right part" data-part="4"></div>
            <div class="leg leg-left part" data-part="5"></div>
            <div class="leg leg-right part" data-part="6"></div>
          </figure>

          <ul class="word" id="word" aria-label="Current word"></ul>
          <p class="status" id="status" role="status" aria-live="polite">
            Ready when you are.
          </p>
        </section>

        <section class="keyboard-panel" aria-label="Letter choices">
          <div class="keyboard" id="keyboard"></div>
        </section>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
